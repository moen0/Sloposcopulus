[package]
name = "agent-meter"
version = "0.1.0"
description = "Local-first AI agent usage monitor"
authors = ["Agent Meter contributors"]
edition = "2021"

[lib]
name = "agent_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1", "apple-native-keyring-store"] }
apple-native-keyring-store = { version = "1", default-features = false, features = ["keychain"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
